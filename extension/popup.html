<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 300px; font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 12px; background: #12151c; color: #e8eaf0; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p { color: #9aa3b5; font-size: 12px; margin: 0 0 10px; }
  .row { display: flex; gap: 6px; align-items: center; background: #171b24; border: 1px solid #232838; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
  .row b { flex: 1; }
  .row span { font-size: 11px; color: #9aa3b5; }
  button { background: #7c6cff; border: none; color: white; border-radius: 8px; padding: 7px 10px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid #232838; color: #e8eaf0; }
  #status { font-size: 12px; color: #9aa3b5; margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>◍ blibs sync</h1>
  <p>Keep <b>muse.ai</b>, <b>chatgpt.com</b>, <b>grok.com</b> open + logged in (pinned tabs work best). This popup scrapes only what you can already see and POSTs it to <code>127.0.0.1:8787</code>.</p>
  <div id="tabs"></div>
  <div id="result" style="font-size:11px; background:#0e1118; border:1px solid #232838; border-radius:8px; padding:8px; margin-top:6px; white-space:pre-wrap; word-break:break-word; max-height:180px; overflow-y:auto; color:#c9d1e0">press Sync to see what happens…</div>
  <div style="display:flex; gap:6px; margin-top:6px">
    <button id="sync">Sync open vendor tabs now</button>
    <button id="open" class="ghost">Open blibs</button>
  </div>
  <div class="row" style="margin-top:6px" title="Only needed if `npm run proxy` runs on another machine (e.g. a VM). Use host:port, e.g. 192.168.5.15:8787. Empty = localhost.">
    <b style="font-size:11px">proxy host</b>
    <input id="host" placeholder="127.0.0.1:8787" style="flex:1; min-width:0; background:#0e1118; border:1px solid #232838; color:#e8eaf0; border-radius:6px; padding:5px 7px; font-size:12px" />
    <button id="saveHost" class="ghost">Save</button>
  </div>
  <div id="status">checking…</div>
  <script src="popup.js"></script>
</body>
</html>
